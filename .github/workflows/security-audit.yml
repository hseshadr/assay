name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"
      - name: Remove action-generated SARIF
        if: ${{ always() }}
        run: rm -f -- results.sarif
      - name: Scan every commit and the current tree
        run: |
          gitleaks git --log-opts=--all --redact --no-banner .
          gitleaks dir --redact --no-banner .
          test ! -e results.sarif
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  dependencies:
    name: Locked dependency audits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "11.5.0"
          run_install: false
      - name: Audit the frozen Python and npm graphs
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv lock --check
          uv export --frozen --all-groups --all-extras --no-emit-project --format requirements.txt --output-file /tmp/assay-audit-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/assay-audit-requirements.txt --require-hashes --strict --disable-pip --progress-spinner off
          pnpm --dir ts install --frozen-lockfile --ignore-scripts
          pnpm --dir ts audit --audit-level high
          test -z "$(git status --porcelain)"

  workflows:
    name: Workflow security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Run actionlint at a fixed version
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run zizmor at a fixed version
        run: uvx zizmor==1.29.0 --persona=pedantic --min-severity=low --offline --strict-collection .github
      - name: Run ShellCheck over every shipped shell entry point
        run: shellcheck examples/*.sh scripts/*.sh
      - name: Prove workflow checks preserve the tree
        run: test -z "$(git status --porcelain)"
