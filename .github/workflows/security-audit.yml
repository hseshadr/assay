# Weekly pip-audit over the locked dependency set.
#
# Deliberately its own workflow, not a CI step: new CVEs appear against unchanged
# code, so this must run on a schedule — and a known-unfixable advisory must not
# mask real code regressions in the main gate.
# A red scheduled run counts as a red repo — check `gh run list` explicitly.
name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — advisories move without commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        # Exact version in the comment, never a floating `# v9` — see ci.yml.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Export locked dependencies
        # --all-extras: audit the scoring stack (scikit-learn/scipy/numpy) too, not
        # just the light envelope base deps.
        run: uv export --frozen --all-extras --no-emit-project --no-hashes -o requirements-audit.txt

      # --disable-pip --no-deps: audit the pinned export directly, no venv.
      # Safe because uv export pins the full transitive set from uv.lock.
      - name: Audit dependencies for known vulnerabilities
        run: uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps
