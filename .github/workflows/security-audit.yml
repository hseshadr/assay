name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-secrets:
    name: Shared full-history secret scan
    permissions:
      contents: read
      pull-requests: read # Let the shared action enumerate commits on PR events.
    uses: hseshadr/ci/.github/workflows/secret-scan.yml@8166345c9355dde54c12fa95d0457c4ea97d3e64 # ci-v3.3.0
    with:
      runs-on: ubuntu-24.04
      full-history: true

  secrets:
    name: Full-history secret scan
    needs: [shared-secrets]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Enforce shared secret scan result
        env:
          SHARED_SCAN_RESULT: ${{ needs.shared-secrets.result }}
        run: test "$SHARED_SCAN_RESULT" = success
