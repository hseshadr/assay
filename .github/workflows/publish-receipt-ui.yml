# assay — .github/workflows/publish-receipt-ui.yml
# npm release of `@edgeproc/receipt-ui` (ts/packages/receipt-ui) via OIDC Trusted
# Publishing. A `receipt-ui-v*` tag push is the whole trigger; there is NO npm write
# token in this repo.
#
# DELIBERATELY A SEPARATE FILE from publish.yml — the two rails cannot cross-fire:
#   * publish.yml triggers on `v*`, which only matches tag names that START with "v",
#     so it can never fire on `receipt-ui-v0.2.0`; and this file's `receipt-ui-v*`
#     can never match a `vX.Y.Z` tag. One tag, exactly one rail.
#   * npm Trusted Publishing is registered per-package against the CALLER workflow
#     filename: @edgeproc/receipt-ui -> {owner, assay, publish-receipt-ui.yml},
#     disjoint from @edgeproc/avow -> {owner, assay, publish.yml}.
#
# receipt-ui is versioned separately from the repo's `v*`-tagged avow co-releases (see
# ts/packages/receipt-ui/CHANGELOG.md). Release = bump the package version + changelog,
# merge to main, then `git tag receipt-ui-vX.Y.Z && git push origin receipt-ui-vX.Y.Z`.
# `@edgeproc/receipt-ui` 0.1.0 is already live on npm, so the name-creation bootstrap is
# DONE (npm has no "pending publisher" — the name had to exist before a trusted publisher
# could attach). Registries refuse to overwrite a published version: bump before tagging.
#
# Gate scope: ts-publish runs its gate FROM working-directory, so the gate here is
# receipt-ui's own `pnpm gate` (biome -> tsc strict -> vitest -> build) — it covers the
# package being shipped, not the whole workspace (ci.yml's ts-gate covers the workspace
# on every merge to main). The workspace-root `@edgeproc/avow` is built first in
# gate-command because receipt-ui's typecheck/tests resolve the workspace-linked avow
# through its exports at ts/dist/, which does not exist on a fresh runner.
#
# provenance is TRUE: assay is public, and `--provenance` writes a public
# transparency-log entry linking each release to this repo + workflow.
#
# NOTE: hseshadr/ci is pinned to a full commit SHA, not the moving `ci-v2` tag — a tag
# can be repointed at new code, a SHA cannot. The trailing comment records which release
# that SHA is; Dependabot's `github-actions` ecosystem bumps both the pin and the
# comment. tests/test_workflow_security.py enforces this for every `uses:` in this repo.
name: Publish receipt-ui (npm, OIDC)
on:
  push:
    tags: ["receipt-ui-v*"]
# Top-level read-only; the OIDC write scope is granted on the publish job only (the ci
# repo security policy forbids a top-level `id-token: write`).
permissions:
  contents: read
jobs:
  publish-npm:
    permissions:
      id-token: write # OIDC — npm verifies this against the registered trusted publisher.
      contents: read
    uses: hseshadr/ci/.github/workflows/ts-publish.yml@b10a24c576f8210635f00f5e5fd7a27c614409a9 # ci-v3.2.1
    with:
      working-directory: ts/packages/receipt-ui
      # assay has no ROOT package.json/lockfile — the pnpm workspace lives in ts/, and
      # the packageManager pin + lockfile both sit at that workspace root. Without these
      # two paths, pnpm/action-setup finds no pnpm version and setup-node cannot resolve
      # the pnpm cache key.
      package-json-file: ts/package.json
      cache-dependency-path: ts/pnpm-lock.yaml
      # Build the workspace-root @edgeproc/avow before the package gate: receipt-ui's
      # typecheck/tests import it via the workspace link, whose exports point at ts/dist/.
      gate-command: "pnpm --workspace-root run build && pnpm run gate"
      provenance: true # repo is public — provenance writes a public transparency-log entry
