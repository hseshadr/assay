name: Dagger
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dagger-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dagger:
    name: Dagger
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run deterministic Dagger checks
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.8"
          verb: check
          args: "shellcheck:check assay:distribution assay:example assay:parity assay:publish-ready assay:python assay:security"
      - run: dagger check assay:mutations
      - run: dagger check assay:typescript
      - run: dagger check assay:benchmarks
