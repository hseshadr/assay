name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Mirrors `uv run poe gate` exactly: the gate IS the CI. Steps inside the gate:
  # ruff lint -> ruff format --check -> mypy strict -> xenon A -> pytest (>=90%).
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        # The comment names the EXACT version, never a floating `# v9`: Dependabot
        # rewrites the SHA and its comment together, and a floating major becomes a lie
        # the moment upstream re-points the tag.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
      - name: Pin Python
        run: uv python install 3.13

      # --frozen: install the committed uv.lock verbatim, so CI cannot silently
      # re-resolve dependencies. --all-extras: the gate exercises the full surface
      # (scoring face + CLI), now behind the [assay]/[cli] extras.
      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run the gate
        run: uv run poe gate

  # The TypeScript package `@edgeproc/avow`. Its conformance suite replays the SAME golden
  # vectors (testdata/vectors/*.json) the Python gate generates, asserting the TS
  # canonicalizer + verifier reproduce Python's bytes/hashes/signatures exactly.
  # A cross-language byte divergence fails HERE, in CI, never in production.
  ts-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.5.0

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lint (biome) -> typecheck (tsc strict) -> vitest conformance -> build,
      # across every workspace package (avow + receipt-ui), not just the root.
      - name: Run the TS gate
        run: pnpm -r --include-workspace-root gate

  # Mirrors `uv run poe mutants`. A separate job, not a step inside `gate`, because it
  # answers a different question: `gate` asks "do the tests pass", this asks "can they
  # fail". It breaks each named guard in turn and requires the suite to go red, so a
  # test that quietly stops guarding its claim fails HERE rather than being discovered
  # in an audit months later.
  mutation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
      - name: Pin Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      # The harness edits tracked files in place and restores them in a `finally`; it
      # refuses to start if any file it touches is already dirty.
      - name: Break every guard and require the suite to notice
        run: uv run poe mutants

  # Full-history secret scan.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0 # full history — gitleaks scans every commit

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
