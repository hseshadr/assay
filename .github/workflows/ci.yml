name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.13
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.13.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: "11.5.0"
          run_install: false
      - name: Run the exact-commit Python gate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = "v22.13.0"
          uv sync --frozen --all-groups --all-extras
          pnpm --dir ts install --frozen-lockfile --ignore-scripts
          uv run poe gate
          test -z "$(git status --porcelain)"

  typescript:
    name: TypeScript (Node 22.13.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.13.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: "11.5.0"
          run_install: false
      - name: Run the exact-commit TypeScript gate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = "v22.13.0"
          test "$(pnpm --version)" = "11.5.0"
          pnpm --dir ts install --frozen-lockfile --ignore-scripts
          pnpm --dir ts gate
          pnpm --dir ts clean
          test -z "$(git status --porcelain)"

  parity:
    name: Python/TypeScript parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.13.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: "11.5.0"
          run_install: false
      - name: Replay every shared vector at the exact commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv sync --frozen --all-groups --all-extras
          pnpm --dir ts install --frozen-lockfile --ignore-scripts
          uv run pytest tests/test_consumer_conformance.py tests/test_metric_vectors.py -q
          pnpm --dir ts exec vitest run src/compositionVectors.test.ts src/metricVectors.test.ts
          test -z "$(git status --porcelain)"

  mutation:
    name: Mutation guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.13.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: "11.5.0"
          run_install: false
      - name: Prove the exact cross-runtime mutation set
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv sync --frozen --all-groups --all-extras
          pnpm --dir ts install --frozen-lockfile --ignore-scripts
          uv run poe mutants
          test -z "$(git status --porcelain)"

  example:
    name: Installed-artifact example
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.13.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: "11.5.0"
          run_install: false
      - name: Run the installed Python/npm example at the exact commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv sync --frozen --all-groups
          pnpm --dir ts install --frozen-lockfile --ignore-scripts
          uv run pytest tests/test_example.py tests/test_measurement.py -q
          bash examples/run_composite.sh
          test -z "$(git status --porcelain)"

  benchmarks:
    name: Frozen benchmarks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.13.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: "11.5.0"
          run_install: false
      - name: Enforce frozen scoring budgets
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv sync --frozen --all-groups --all-extras
          pnpm --dir ts install --frozen-lockfile --ignore-scripts
          uv run python -m benchmarks.release
          pnpm --dir ts benchmark
          pnpm --dir ts clean
          test -z "$(git status --porcelain)"

  artifacts:
    name: Release artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.13.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: "11.5.0"
          run_install: false
      - name: Build and clean-install exact-commit artifacts
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv sync --frozen --all-groups --all-extras
          pnpm --dir ts install --frozen-lockfile --ignore-scripts
          bash scripts/build_release_artifacts.sh release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assay-ci-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7
      - name: Prove build cleanup
        run: |
          rm -rf release
          pnpm --dir ts clean
          test -z "$(git status --porcelain)"
