name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Mirrors `uv run poe gate` exactly: the gate IS the CI. Steps inside the gate:
  # ruff lint -> ruff format --check -> mypy strict -> xenon A -> pytest (>=90%).
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
      - name: Pin Python
        run: uv python install 3.13

      # --frozen: install the committed uv.lock verbatim, so CI cannot silently
      # re-resolve dependencies.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run the gate
        run: uv run poe gate

  # Full-history secret scan.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0 # full history — gitleaks scans every commit

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
