name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Mirrors `uv run poe gate` exactly: the gate IS the CI. Steps inside the gate:
  # ruff lint -> ruff format --check -> mypy strict -> xenon A -> pytest (>=90%).
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
      - name: Pin Python
        run: uv python install 3.13

      # --frozen: install the committed uv.lock verbatim, so CI cannot silently
      # re-resolve dependencies. --all-extras: the gate exercises the full surface
      # (scoring face + CLI), now behind the [assay]/[cli] extras.
      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run the gate
        run: uv run poe gate

  # The TypeScript package `@edgeproc/avow`. Its conformance suite replays the SAME golden
  # vectors (testdata/vectors/*.json) the Python gate generates, asserting the TS
  # canonicalizer + verifier reproduce Python's bytes/hashes/signatures exactly.
  # A cross-language byte divergence fails HERE, in CI, never in production.
  ts-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.5.0

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lint (biome) -> typecheck (tsc strict) -> vitest conformance -> build.
      - name: Run the TS gate
        run: pnpm gate

  # Full-history secret scan.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0 # full history — gitleaks scans every commit

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
