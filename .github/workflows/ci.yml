name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Mirrors `uv run poe gate` exactly: the gate IS the CI. Steps inside the gate:
  # ruff lint -> ruff format --check -> mypy strict -> xenon A -> pytest (>=90%).
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        # The comment names the EXACT version, never a floating `# v9`: Dependabot
        # rewrites the SHA and its comment together, and a floating major becomes a lie
        # the moment upstream re-points the tag.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
      - name: Pin Python
        run: uv python install 3.13

      # --frozen: install the committed uv.lock verbatim, so CI cannot silently
      # re-resolve dependencies. --all-extras: the gate exercises the full surface
      # (scoring face + CLI), now behind the [metrics]/[cli] extras.
      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run the gate
        run: uv run poe gate

  # Benchmark, TypeScript, and mutation CI lanes belonged to the mixed Avow product.
  # They remain unavailable during the split. Task 9 must add release-ready controls;
  # this transitional workflow makes no publication or performance claim.

  # Secret scan, via the shared brick in hseshadr/ci — where the
  # mechanics and their rationale now live. One maintained copy of this control
  # instead of an inlined duplicate that drifts: the brick also sets
  # persist-credentials: false and grants pull-requests: read, both of which this
  # inlined copy was missing.
  # Scope, stated accurately: on push and pull_request gitleaks-action passes
  # --log-opts=--no-merges --first-parent <base>^..<head>, so it reads the commits
  # that push or PR introduces — NOT the whole repository. fetch-depth: 0 only
  # makes the base commit reachable so that range resolves. A full sweep needs a
  # schedule or workflow_dispatch event, and this workflow fires on neither.
  gitleaks:
    name: Secret scan
    # The reusable workflow lists a PR's commits over the API, which needs
    # pull-requests: read. The workflow-level `contents: read` does not grant it,
    # and a caller job may raise a scope the read-only top level withholds.
    permissions:
      contents: read
      pull-requests: read
    uses: hseshadr/ci/.github/workflows/secret-scan.yml@605e51cbc86f452b56edcf1c9660921da797cbfe # ci-v3.2.1
