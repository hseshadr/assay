name: Publish trusted artifacts
on: # zizmor: ignore[dangerous-triggers] source-free bridge accepts only a successful manual default-branch candidate and its exact artifact
  workflow_run:
    workflows: [Dagger release candidate]
    types: [completed]
permissions: {}
concurrency:
  group: assay-publish
  cancel-in-progress: false
jobs:
  publish-python:
    name: Publish exact Python candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      actions: read # Download only the triggering candidate artifact.
      id-token: write # Mint the short-lived PyPI publishing identity.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-${{ github.event.workflow_run.head_sha }}
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - id: plan
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.8"
          verb: call
          module: github.com/hseshadr/assay@${{ github.event.workflow_run.head_sha }}
          args: pypi-required --candidate=candidate --expected-sha=${{ github.event.workflow_run.head_sha }}
      - if: steps.plan.outputs.output == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: candidate/release/python
          attestations: true
          print-hash: true
  publish-npm:
    name: Publish exact npm candidate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      actions: read # Download only the triggering candidate artifact.
      id-token: write # Pass typed OIDC request values to Dagger's npm publisher.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-${{ github.event.workflow_run.head_sha }}
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.8"
          verb: call
          module: github.com/hseshadr/assay@${{ github.event.workflow_run.head_sha }}
          args: publish-npm --candidate=candidate --expected-sha=${{ github.event.workflow_run.head_sha }} --oidc-url=env:ACTIONS_ID_TOKEN_REQUEST_URL --oidc-token=env:ACTIONS_ID_TOKEN_REQUEST_TOKEN
