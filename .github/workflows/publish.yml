name: Publish trusted artifacts

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      recover_dev2_github_mirror:
        description: Recover the immutable v0.5.0-dev.2 GitHub mirror only
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish-assay
  cancel-in-progress: false

jobs:
  secret-scan:
    name: Release full-history secret scan
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
    uses: hseshadr/ci/.github/workflows/secret-scan.yml@8166345c9355dde54c12fa95d0457c4ea97d3e64 # ci-v3.3.0
    with:
      runs-on: ubuntu-24.04
      full-history: true

  build:
    name: Unprivileged release eligibility and build
    needs: [secret-scan]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.5.0"
          run_install: false
      - name: Install fixed actionlint
        run: |
          set -euo pipefail
          archive="actionlint_1.7.12_linux_amd64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          install_root="$RUNNER_TEMP/actionlint"
          curl --fail --location --silent --show-error \
            --output "$archive_path" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          printf '%s  %s\n' \
            "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8" \
            "$archive_path" | sha256sum --check --status
          mkdir "$install_root"
          tar -xzf "$archive_path" -C "$install_root"
          test "$("$install_root/actionlint" -version | head -1)" = "1.7.12"
          echo "$install_root" >> "$GITHUB_PATH"
      - name: Verify exact tag and artifact versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --force origin \
            refs/heads/main:refs/remotes/origin/main
          uv sync --frozen --all-groups
          uv run python scripts/verify_release_identity.py "$RELEASE_TAG" "$GITHUB_SHA"
      - name: Run the complete release candidate gate
        run: ASSAY_ARTIFACT_ROOT=release uv run poe release-candidate
      - name: Rebuild the reviewed release envelope after cleanup
        run: bash scripts/build_release_artifacts.sh release
      - name: Stage the checksum-pinned npm 12.0.2 publisher
        run: bash scripts/stage_npm_publisher.sh publish-tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assay-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assay-npm-publisher-${{ github.sha }}
          path: publish-tools/
          if-no-files-found: error
          retention-days: 1
      - name: Always clean release outputs and verify tree
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -rf -- release publish-tools
          pnpm --dir ts clean
          test ! -e release
          test ! -e publish-tools
          test ! -e ts/dist
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  preflight-python:
    name: Check PyPI release state
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download the reviewed release artifact.
      contents: read # Checkout the unprivileged registry guard.
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-release-${{ github.sha }}
          path: release
      - name: Check existing PyPI bytes and provenance
        id: registry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          PYTHON_VERSION="${VERSION/-dev./.dev}"
          python3 -m scripts.registry_release_guard pypi release/python "$PYTHON_VERSION" "$GITHUB_OUTPUT"

  preflight-npm:
    name: Check npm release state
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download the reviewed release artifact.
      contents: read # Checkout the unprivileged registry guard.
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
      dist-tag: ${{ steps.registry.outputs.dist-tag }}
      publish-tag: ${{ steps.registry.outputs.publish-tag }}
      channel-version: ${{ steps.registry.outputs.channel-version }}
      publish-tag-version: ${{ steps.registry.outputs.publish-tag-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-release-${{ github.sha }}
          path: release
      - name: Check existing npm bytes and provenance
        id: registry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          python3 -m scripts.registry_release_guard npm release/npm "$VERSION" "$GITHUB_OUTPUT"

  publish-python:
    name: Publish missing PyPI release through OIDC
    needs: [build, preflight-python, preflight-npm]
    if: ${{ needs.preflight-python.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      actions: read # Download the reviewed Python artifacts.
      id-token: write # Request a short-lived PyPI publishing identity.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-release-${{ github.sha }}
          path: release
      - name: Publish Python artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/python/
          attestations: true
          print-hash: true

  publish-npm:
    name: Publish missing npm release with provenance
    needs: [build, preflight-python, preflight-npm]
    if: ${{ needs.preflight-npm.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      actions: read # Download the reviewed npm artifact.
      id-token: write # Bind npm provenance to this exact GitHub workflow run.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-release-${{ github.sha }}
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-npm-publisher-${{ github.sha }}
          path: publish-tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Verify the staged npm publisher
        run: |
          set -euo pipefail
          NPM_PUBLISHER_SHA512="b885e890b9418fa1693544d05f53e64f9a73ec194837d4258b15fecdd692347b1dd2a517b1b0cbaf9d31cd8e92c3b70956bd2ecc72833a57b4b3098f5bfa7943"
          printf '%s  %s\n' "$NPM_PUBLISHER_SHA512" publish-tools/npm-12.0.2.tgz | sha512sum --check --status
          mkdir /tmp/npm-publisher
          tar -xzf publish-tools/npm-12.0.2.tgz -C /tmp/npm-publisher
          test "$(node /tmp/npm-publisher/package/bin/npm-cli.js --version)" = "12.0.2"
      - name: Publish reviewed npm artifact with provenance
        env:
          EXPECTED_CHANNEL_VERSION: ${{ needs.preflight-npm.outputs.channel-version }}
          EXPECTED_PUBLISH_TAG_VERSION: ${{ needs.preflight-npm.outputs.publish-tag-version }}
          NPM_CHANNEL: ${{ needs.preflight-npm.outputs.dist-tag }}
          NPM_PUBLISH_TAG: ${{ needs.preflight-npm.outputs.publish-tag }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/npm-package.json \
            --write-out '%{http_code}' --connect-timeout 5 --max-time 20 --max-filesize 1048576 \
            https://registry.npmjs.org/%40edgeproc%2Fassay)"
          if test "$status" = 404; then
            current_channel="__ABSENT__"
            current_publish_tag="__ABSENT__"
          elif test "$status" = 200; then
            jq -e 'if type != "object" or (.name == "@edgeproc/assay") != true or (."dist-tags" | type != "object") then error("malformed registry state") else . end' /tmp/npm-package.json >/dev/null
            current_channel="$(jq -er --arg tag "$NPM_CHANNEL" '."dist-tags" as $tags | if $tags | has($tag) then $tags[$tag] | if type == "string" then . else error("malformed tag") end else "__ABSENT__" end' /tmp/npm-package.json)"
            current_publish_tag="$(jq -er --arg tag "$NPM_PUBLISH_TAG" '."dist-tags" as $tags | if $tags | has($tag) then $tags[$tag] | if type == "string" then . else error("malformed tag") end else "__ABSENT__" end' /tmp/npm-package.json)"
          else
            echo "npm registry channel recheck failed with HTTP $status" >&2
            exit 1
          fi
          test "$current_channel" = "$EXPECTED_CHANNEL_VERSION"
          test "$current_publish_tag" = "$EXPECTED_PUBLISH_TAG_VERSION"
          node /tmp/npm-publisher/package/bin/npm-cli.js publish \
            release/npm/*.tgz --access public --provenance \
            --ignore-scripts --tag "$NPM_PUBLISH_TAG"

  verify-published:
    name: Verify registry bytes
    needs: [preflight-python, preflight-npm, publish-python, publish-npm]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.preflight-python.result == 'success' &&
        needs.preflight-npm.result == 'success' &&
        (needs.publish-python.result == 'success' || needs.publish-python.result == 'skipped') &&
        (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download the reviewed bytes for registry comparison.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-release-${{ github.sha }}
          path: release
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.5.0"
          run_install: false
      - name: Verify registries serve the reviewed bytes and provenance
        env:
          NPM_DIST_TAG: ${{ needs.preflight-npm.outputs.dist-tag }}
          NPM_PUBLISH: ${{ needs.preflight-npm.outputs.publish }}
          NPM_PUBLISH_TAG: ${{ needs.preflight-npm.outputs.publish-tag }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin \
            refs/heads/main:refs/remotes/origin/main
          python3 scripts/verify_release_identity.py "$RELEASE_TAG" "$GITHUB_SHA"
          python3 -m scripts.verify_published_release \
            release "$NPM_DIST_TAG" "$NPM_PUBLISH_TAG" "$NPM_PUBLISH"

  recover-dev2:
    name: Verify exact dev2 partial release for GitHub mirror recovery
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.recover_dev2_github_mirror == true
      }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download only the retained reviewed release envelope.
      contents: read # Verify the immutable tag and protected-main ancestry.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: 35c1fe926c39dfd533b9b7f297abd63eac77c6e6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-release-35c1fe926c39dfd533b9b7f297abd63eac77c6e6
          path: release
          run-id: "32571430932"
          github-token: ${{ github.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.5.0"
          run_install: false
      - name: Verify retained envelope, release identity, and served registries
        env:
          RECOVERY_SHA: 35c1fe926c39dfd533b9b7f297abd63eac77c6e6
          RECOVERY_TAG: v0.5.0-dev.2
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags --force origin \
            refs/heads/main:refs/remotes/origin/main
          git fetch --force origin \
            "refs/tags/$RECOVERY_TAG:refs/tags/$RECOVERY_TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          test -z "$(find release -type l -print -quit)"
          test "$(find release -type f | wc -l | tr -d ' ')" = 4
          printf '%s  %s\n' \
            "2ca7dbd2eb0a7a66022a6356886cc1055195b6ef1f91fd490e1f6dbb72fabf74" \
            release/SHA256SUMS | sha256sum --check --status
          (cd release && sha256sum --check --strict SHA256SUMS)
          python3 -m scripts.verify_release_identity "$RECOVERY_TAG" "$RECOVERY_SHA"
          GITHUB_SHA="$RECOVERY_SHA" RELEASE_TAG="$RECOVERY_TAG" \
            python3 -m scripts.verify_published_release release next next true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assay-dev2-recovery-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish-github:
    name: Publish immutable GitHub release mirror
    needs: [verify-published, recover-dev2]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          (github.event_name == 'push' && needs.verify-published.result == 'success') ||
          (github.event_name == 'workflow_dispatch' &&
           needs.recover-dev2.result == 'success')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read # Download the exact reviewed release envelope.
      attestations: read # Verify the immutable release and every mirrored asset.
      contents: write # Create and verify the immutable public release mirror.
    steps:
      - if: ${{ github.event_name == 'push' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-release-${{ github.sha }}
          path: release
      - if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-dev2-recovery-${{ github.sha }}
          path: release
      - name: Bind the retained dev2 recovery envelope
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          printf '%s  %s\n' \
            "2ca7dbd2eb0a7a66022a6356886cc1055195b6ef1f91fd490e1f6dbb72fabf74" \
            release/SHA256SUMS | sha256sum --check --status
      - name: Verify the reviewed release envelope without repository code
        run: |
          set -euo pipefail
          test -z "$(find release -type l -print -quit)"
          test "$(find release -type f | wc -l | tr -d ' ')" = 4
          wheel=(release/python/*.whl)
          sdist=(release/python/*.tar.gz)
          npm=(release/npm/*.tgz)
          test "${#wheel[@]}" = 1
          test "${#sdist[@]}" = 1
          test "${#npm[@]}" = 1
          (cd release && sha256sum --check --strict SHA256SUMS)
      - name: Create or verify the immutable public mirror
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                '35c1fe926c39dfd533b9b7f297abd63eac77c6e6' || github.sha }}
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                'v0.5.0-dev.2' || github.ref_name }}
        run: |
          set -euo pipefail
          { set +x; } 2>/dev/null
          wheel=(release/python/*.whl)
          sdist=(release/python/*.tar.gz)
          npm=(release/npm/*.tgz)
          assets=(release/SHA256SUMS "${wheel[0]}" "${sdist[0]}" "${npm[0]}")
          expected="$RUNNER_TEMP/expected-release-assets.tsv"
          actual="$RUNNER_TEMP/actual-release-assets.tsv"
          releases="$RUNNER_TEMP/github-releases.json"
          matches="$RUNNER_TEMP/github-release-matches.json"
          state="$RUNNER_TEMP/github-release.json"
          expected_names="$RUNNER_TEMP/expected-release-names.txt"
          expected_prerelease=false
          expected_title="$RELEASE_TAG"
          expected_body="Exact Assay artifacts verified against PyPI, npm, and SHA256SUMS."
          case "$RELEASE_TAG" in *-dev.*) expected_prerelease=true ;; esac
          : > "$expected"
          for asset in "${assets[@]}"; do
            printf '%s\tuploaded\t%s\tsha256:%s\n' \
              "$(basename "$asset")" "$(wc -c < "$asset" | tr -d ' ')" \
              "$(sha256sum "$asset" | cut -d ' ' -f 1)" >> "$expected"
          done
          LC_ALL=C sort -o "$expected" "$expected"
          cut -f 1 "$expected" > "$expected_names"

          gh_bounded() {
            timeout --foreground 30s gh "$@"
          }

          load_release() {
            printf '[]\n' > "$releases"
            for page in $(seq 1 20); do
              page_state="$RUNNER_TEMP/github-releases-$page.json"
              gh_bounded api "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page" \
                > "$page_state" || return 2
              jq -e 'type == "array"' "$page_state" >/dev/null || return 2
              jq -s '.[0] + .[1]' "$releases" "$page_state" > "$releases.next" || return 2
              mv "$releases.next" "$releases"
              page_count="$(jq 'length' "$page_state")"
              test "$page_count" = 100 || break
              test "$page" != 20 || return 2
            done
            jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)]' \
              "$releases" > "$matches" || return 2
            count="$(jq 'length' "$matches")"
            test "$count" -le 1 || return 2
            test "$count" = 1 || return 1
            jq '.[0]' "$matches" > "$state"
          }

          verify_tag() {
            object="$RUNNER_TEMP/github-tag-object.json"
            gh_bounded api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              > "$object" || return 1
            type="$(jq -er '.object.type' "$object")"
            sha="$(jq -er '.object.sha' "$object")"
            for _ in 1 2 3 4; do
              if test "$type" = commit; then
                test "$sha" = "$RELEASE_SHA"
                return
              fi
              test "$type" = tag || return 1
              gh_bounded api "repos/$GITHUB_REPOSITORY/git/tags/$sha" \
                > "$object" || return 1
              type="$(jq -er '.object.type' "$object")"
              sha="$(jq -er '.object.sha' "$object")"
            done
            return 1
          }

          write_actual() {
            jq -r '.assets[] | [.name, .state, (.size | tostring), .digest] | @tsv' \
              "$state" | LC_ALL=C sort > "$actual"
            test "$(cut -f 1 "$actual" | wc -l)" = "$(cut -f 1 "$actual" | sort -u | wc -l)"
          }

          verify_release_identity() {
            jq -e --arg tag "$RELEASE_TAG" --arg title "$expected_title" \
              --arg body "$expected_body" --argjson prerelease "$expected_prerelease" \
              '.tag_name == $tag and .name == $title and .body == $body and
               .prerelease == $prerelease' "$state" >/dev/null
          }

          verify_draft_subset() {
            verify_release_identity
            jq -e '.draft == true and .immutable == false' "$state" >/dev/null
            jq -r '.assets[].name' "$state" | LC_ALL=C sort > "$RUNNER_TEMP/draft-names.txt"
            test "$(wc -l < "$RUNNER_TEMP/draft-names.txt")" = \
              "$(sort -u "$RUNNER_TEMP/draft-names.txt" | wc -l)"
            test -z "$(comm -23 "$RUNNER_TEMP/draft-names.txt" "$expected_names")"
            write_actual
            jq -r '.assets[] | select(.state == "uploaded") |
              [.name, .state, (.size | tostring), .digest] | @tsv' \
              "$state" | LC_ALL=C sort > "$RUNNER_TEMP/uploaded-draft-assets.tsv"
            test -z "$(comm -23 "$RUNNER_TEMP/uploaded-draft-assets.tsv" "$expected")"
          }

          remove_failed_draft_assets() {
            verify_draft_subset
            jq -r '.assets[] | select(.state != "uploaded") | [.id, .name] | @tsv' \
              "$state" > "$RUNNER_TEMP/failed-draft-assets.tsv"
            while IFS=$'\t' read -r id name; do
              test -n "$id" || continue
              grep -Fqx "$name" "$expected_names"
              gh_bounded api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            done < "$RUNNER_TEMP/failed-draft-assets.tsv"
            load_release
            verify_draft_subset
          }

          if load_release; then
            true
          else
            load_status=$?
            test "$load_status" = 1
            verify_tag
            prerelease=()
            test "$expected_prerelease" = false || prerelease=(--prerelease)
            gh_bounded release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag "${prerelease[@]}" \
              --title "$expected_title" --notes "$expected_body"
            load_release
          fi

          if jq -e '.draft == true' "$state" >/dev/null; then
            verify_tag
            remove_failed_draft_assets
            for asset in "${assets[@]}"; do
              record="$(printf '%s\tuploaded\t%s\tsha256:%s' \
                "$(basename "$asset")" "$(wc -c < "$asset" | tr -d ' ')" \
                "$(sha256sum "$asset" | cut -d ' ' -f 1)")"
              if ! grep -Fqx "$record" "$actual"; then
                gh_bounded release upload "$RELEASE_TAG" "$asset" \
                  --repo "$GITHUB_REPOSITORY"
              fi
            done
            load_release
            verify_draft_subset
            cmp "$expected" "$actual"
            verify_tag
            gh_bounded release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --draft=false
          elif jq -e '.draft == false and .immutable == false' "$state" >/dev/null; then
            verify_release_identity
            verify_tag
            write_actual
            cmp "$expected" "$actual"
          elif ! jq -e '.draft == false and .immutable == true' "$state" >/dev/null; then
            echo "existing GitHub release is neither a resumable draft nor immutable" >&2
            exit 1
          fi

          download="$RUNNER_TEMP/public-release-assets"
          deadline=$((SECONDS + 600))
          while test "$SECONDS" -lt "$deadline"; do
            if load_release && verify_release_identity && verify_tag && \
              jq -e '.draft == false and .immutable == true' "$state" >/dev/null; then
              write_actual
              if cmp "$expected" "$actual" && \
                gh_bounded release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"; then
                rm -rf -- "$download"
                mkdir "$download"
                verified=true
                for asset in "${assets[@]}"; do
                  name="$(basename "$asset")"
                  curl --fail --location --silent --show-error \
                    --connect-timeout 5 --max-time 60 --max-filesize 67108864 \
                    --output "$download/$name" \
                    "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$name" \
                    || verified=false
                  test "$verified" = false || cmp "$asset" "$download/$name" || verified=false
                  test "$verified" = false || gh_bounded release verify-asset \
                    "$RELEASE_TAG" "$download/$name" --repo "$GITHUB_REPOSITORY" \
                    || verified=false
                done
                test "$verified" = false || exit 0
              fi
            fi
            sleep 10
          done
          echo "immutable GitHub release verification timed out" >&2
          exit 1
