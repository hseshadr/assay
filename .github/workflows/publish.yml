name: Publish trusted artifacts

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: publish-assay
  cancel-in-progress: false

jobs:
  build:
    name: Unprivileged release eligibility and build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.13.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: "11.5.0"
          run_install: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"
      - name: Install fixed actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify exact tag and artifact versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv sync --frozen --all-groups
          uv run python scripts/verify_release_identity.py "$RELEASE_TAG"
      - name: Run the complete release candidate gate
        run: ASSAY_ARTIFACT_ROOT=release uv run poe release-candidate
      - name: Stage the checksum-pinned npm 12.0.2 publisher
        run: bash scripts/stage_npm_publisher.sh publish-tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assay-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assay-npm-publisher-${{ github.sha }}
          path: publish-tools/
          if-no-files-found: error
          retention-days: 1

  preflight-python:
    name: Check PyPI release state
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download the reviewed release artifact.
      contents: read # Checkout the unprivileged registry guard.
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: assay-release-${{ github.sha }}
          path: release
      - name: Check existing PyPI bytes and provenance
        id: registry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS)
          VERSION="${RELEASE_TAG#v}"
          PYTHON_VERSION="${VERSION/-dev./.dev}"
          python3 -m scripts.registry_release_guard pypi release/python "$PYTHON_VERSION" "$GITHUB_OUTPUT"

  preflight-npm:
    name: Check npm release state
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download the reviewed release artifact.
      contents: read # Checkout the unprivileged registry guard.
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
      dist-tag: ${{ steps.registry.outputs.dist-tag }}
      publish-tag: ${{ steps.registry.outputs.publish-tag }}
      channel-version: ${{ steps.registry.outputs.channel-version }}
      publish-tag-version: ${{ steps.registry.outputs.publish-tag-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: assay-release-${{ github.sha }}
          path: release
      - name: Check existing npm bytes and provenance
        id: registry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS)
          VERSION="${RELEASE_TAG#v}"
          python3 -m scripts.registry_release_guard npm release/npm "$VERSION" "$GITHUB_OUTPUT"

  publish-python:
    name: Publish missing PyPI release through OIDC
    needs: [build, preflight-python, preflight-npm]
    if: ${{ needs.preflight-python.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download the reviewed Python artifacts.
      id-token: write # Request a short-lived PyPI publishing identity.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: assay-release-${{ github.sha }}
          path: release
      - name: Publish Python artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: release/python/
          attestations: true
          print-hash: true

  publish-npm:
    name: Publish missing npm release through OIDC
    needs: [build, preflight-python, preflight-npm]
    if: ${{ needs.preflight-npm.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download the reviewed npm artifact.
      id-token: write # Request a short-lived npm publishing identity.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: assay-release-${{ github.sha }}
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: assay-npm-publisher-${{ github.sha }}
          path: publish-tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Verify and invoke only the staged npm 12.0.2 publisher
        env:
          EXPECTED_CHANNEL_VERSION: ${{ needs.preflight-npm.outputs.channel-version }}
          EXPECTED_PUBLISH_TAG_VERSION: ${{ needs.preflight-npm.outputs.publish-tag-version }}
          NPM_CHANNEL: ${{ needs.preflight-npm.outputs.dist-tag }}
          NPM_PUBLISH_TAG: ${{ needs.preflight-npm.outputs.publish-tag }}
        run: |
          set -euo pipefail
          (cd publish-tools && sha512sum --check SHA512SUMS)
          mkdir /tmp/npm-publisher
          tar -xzf publish-tools/npm-12.0.2.tgz -C /tmp/npm-publisher
          test "$(node /tmp/npm-publisher/package/bin/npm-cli.js --version)" = "12.0.2"
          status="$(curl --silent --show-error --output /tmp/npm-package.json \
            --write-out '%{http_code}' --connect-timeout 5 --max-time 20 \
            https://registry.npmjs.org/%40edgeproc%2Fassay)"
          if test "$status" = 404; then
            current_channel=""
            current_publish_tag=""
          elif test "$status" = 200; then
            current_channel="$(jq -er --arg tag "$NPM_CHANNEL" '."dist-tags"[$tag] // ""' /tmp/npm-package.json)"
            current_publish_tag="$(jq -er --arg tag "$NPM_PUBLISH_TAG" '."dist-tags"[$tag] // ""' /tmp/npm-package.json)"
          else
            echo "npm registry channel recheck failed with HTTP $status" >&2
            exit 1
          fi
          test "$current_channel" = "$EXPECTED_CHANNEL_VERSION"
          test "$current_publish_tag" = "$EXPECTED_PUBLISH_TAG_VERSION"
          node /tmp/npm-publisher/package/bin/npm-cli.js publish release/npm/*.tgz \
            --access public --provenance --tag "$NPM_PUBLISH_TAG"

  verify-published:
    name: Verify registry bytes
    needs: [preflight-python, preflight-npm, publish-python, publish-npm]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.preflight-python.result == 'success' &&
        needs.preflight-npm.result == 'success' &&
        (needs.publish-python.result == 'success' || needs.publish-python.result == 'skipped') &&
        (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download the reviewed bytes for registry comparison.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: assay-release-${{ github.sha }}
          path: release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Verify registries serve the reviewed bytes and provenance
        env:
          NPM_DIST_TAG: ${{ needs.preflight-npm.outputs.dist-tag }}
          NPM_PUBLISH: ${{ needs.preflight-npm.outputs.publish }}
          NPM_PUBLISH_TAG: ${{ needs.preflight-npm.outputs.publish-tag }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          PYTHON_VERSION="${VERSION/-dev./.dev}"
          for attempt in $(seq 1 60); do
            : > /tmp/pypi-state
            : > /tmp/npm-state
            if python3 -m scripts.registry_release_guard \
                pypi release/python "$PYTHON_VERSION" /tmp/pypi-state && \
              python3 -m scripts.registry_release_guard \
                npm release/npm "$VERSION" /tmp/npm-state && \
              grep -qx 'publish=false' /tmp/pypi-state && \
              grep -qx 'publish=false' /tmp/npm-state && \
              CURRENT_TAG="$(npm view @edgeproc/assay dist-tags."$NPM_DIST_TAG")" && \
              python3 scripts/verify_npm_dist_tag.py "$VERSION" "$CURRENT_TAG" && \
              { test "$NPM_PUBLISH" != true || \
                test "$(npm view @edgeproc/assay dist-tags."$NPM_PUBLISH_TAG")" = "$VERSION"; }; then
              echo "verified registry bytes for assay ${PYTHON_VERSION} and @edgeproc/assay ${VERSION}"
              exit 0
            fi
            echo "attempt ${attempt}/60: registry bytes are not ready"
            sleep 10
          done
          echo "registry verification timed out" >&2
          exit 1
