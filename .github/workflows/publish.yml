name: Publish trusted artifacts

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: publish-assay
  cancel-in-progress: false

jobs:
  build:
    name: Unprivileged release eligibility and build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "11.5.0"
          run_install: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"
      - name: Install fixed actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify exact tag and artifact versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv sync --frozen --all-groups
          uv run python scripts/verify_release_identity.py "$RELEASE_TAG" "$GITHUB_SHA"
      - name: Run the complete release candidate gate
        run: ASSAY_ARTIFACT_ROOT=release uv run poe release-candidate
      - name: Rebuild the reviewed release envelope after cleanup
        run: bash scripts/build_release_artifacts.sh release
      - name: Stage the checksum-pinned npm 12.0.2 publisher
        run: bash scripts/stage_npm_publisher.sh publish-tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assay-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assay-npm-publisher-${{ github.sha }}
          path: publish-tools/
          if-no-files-found: error
          retention-days: 1

  preflight-python:
    name: Check PyPI release state
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download the reviewed release artifact.
      contents: read # Checkout the unprivileged registry guard.
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-release-${{ github.sha }}
          path: release
      - name: Check existing PyPI bytes and provenance
        id: registry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          PYTHON_VERSION="${VERSION/-dev./.dev}"
          python3 -m scripts.registry_release_guard pypi release/python "$PYTHON_VERSION" "$GITHUB_OUTPUT"

  preflight-npm:
    name: Check npm release state
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download the reviewed release artifact.
      contents: read # Checkout the unprivileged registry guard.
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
      dist-tag: ${{ steps.registry.outputs.dist-tag }}
      publish-tag: ${{ steps.registry.outputs.publish-tag }}
      channel-version: ${{ steps.registry.outputs.channel-version }}
      publish-tag-version: ${{ steps.registry.outputs.publish-tag-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-release-${{ github.sha }}
          path: release
      - name: Check existing npm bytes and provenance
        id: registry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          python3 -m scripts.registry_release_guard npm release/npm "$VERSION" "$GITHUB_OUTPUT"

  publish-python:
    name: Publish missing PyPI release through OIDC
    needs: [build, preflight-python, preflight-npm]
    if: ${{ needs.preflight-python.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download the reviewed Python artifacts.
      id-token: write # Request a short-lived PyPI publishing identity.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-release-${{ github.sha }}
          path: release
      - name: Publish Python artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/python/
          attestations: true
          print-hash: true

  publish-npm:
    name: Publish missing npm release through OIDC
    needs: [build, preflight-python, preflight-npm]
    if: ${{ needs.preflight-npm.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download the reviewed npm artifact.
      id-token: write # Request a short-lived npm publishing identity.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-release-${{ github.sha }}
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-npm-publisher-${{ github.sha }}
          path: publish-tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Verify and invoke only the staged npm 12.0.2 publisher
        env:
          EXPECTED_CHANNEL_VERSION: ${{ needs.preflight-npm.outputs.channel-version }}
          EXPECTED_PUBLISH_TAG_VERSION: ${{ needs.preflight-npm.outputs.publish-tag-version }}
          NPM_CHANNEL: ${{ needs.preflight-npm.outputs.dist-tag }}
          NPM_PUBLISH_TAG: ${{ needs.preflight-npm.outputs.publish-tag }}
        run: |
          set -euo pipefail
          NPM_PUBLISHER_SHA512="b885e890b9418fa1693544d05f53e64f9a73ec194837d4258b15fecdd692347b1dd2a517b1b0cbaf9d31cd8e92c3b70956bd2ecc72833a57b4b3098f5bfa7943"
          printf '%s  %s\n' "$NPM_PUBLISHER_SHA512" publish-tools/npm-12.0.2.tgz | sha512sum --check --status
          mkdir /tmp/npm-publisher
          tar -xzf publish-tools/npm-12.0.2.tgz -C /tmp/npm-publisher
          test "$(node /tmp/npm-publisher/package/bin/npm-cli.js --version)" = "12.0.2"
          status="$(curl --silent --show-error --output /tmp/npm-package.json \
            --write-out '%{http_code}' --connect-timeout 5 --max-time 20 --max-filesize 1048576 \
            https://registry.npmjs.org/%40edgeproc%2Fassay)"
          if test "$status" = 404; then
            current_channel="__ABSENT__"
            current_publish_tag="__ABSENT__"
          elif test "$status" = 200; then
            jq -e 'if type != "object" or (."dist-tags" | type != "object") then error("malformed registry state") else . end' /tmp/npm-package.json >/dev/null
            current_channel="$(jq -er --arg tag "$NPM_CHANNEL" '."dist-tags" as $tags | if $tags | has($tag) then $tags[$tag] | if type == "string" then . else error("malformed tag") end else "__ABSENT__" end' /tmp/npm-package.json)"
            current_publish_tag="$(jq -er --arg tag "$NPM_PUBLISH_TAG" '."dist-tags" as $tags | if $tags | has($tag) then $tags[$tag] | if type == "string" then . else error("malformed tag") end else "__ABSENT__" end' /tmp/npm-package.json)"
          else
            echo "npm registry channel recheck failed with HTTP $status" >&2
            exit 1
          fi
          test "$current_channel" = "$EXPECTED_CHANNEL_VERSION"
          test "$current_publish_tag" = "$EXPECTED_PUBLISH_TAG_VERSION"
          node /tmp/npm-publisher/package/bin/npm-cli.js publish release/npm/*.tgz \
            --access public --provenance --tag "$NPM_PUBLISH_TAG"

  verify-published:
    name: Verify registry bytes
    needs: [preflight-python, preflight-npm, publish-python, publish-npm]
    if: >-
      ${{
        always() &&
        !cancelled() &&
        needs.preflight-python.result == 'success' &&
        needs.preflight-npm.result == 'success' &&
        (needs.publish-python.result == 'success' || needs.publish-python.result == 'skipped') &&
        (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # Download the reviewed bytes for registry comparison.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assay-release-${{ github.sha }}
          path: release
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "11.5.0"
          run_install: false
      - name: Verify registries serve the reviewed bytes and provenance
        env:
          NPM_DIST_TAG: ${{ needs.preflight-npm.outputs.dist-tag }}
          NPM_PUBLISH: ${{ needs.preflight-npm.outputs.publish }}
          NPM_PUBLISH_TAG: ${{ needs.preflight-npm.outputs.publish-tag }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release_identity.py "$RELEASE_TAG" "$GITHUB_SHA"
          python3 scripts/verify_published_release.py \
            release "$NPM_DIST_TAG" "$NPM_PUBLISH_TAG" "$NPM_PUBLISH"
