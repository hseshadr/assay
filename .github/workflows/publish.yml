# assay — .github/workflows/publish.yml
# One repo, TWO OIDC releases on a `v*` tag: the Python `avow` kernel to PyPI AND the
# byte-compatible TS Lego `@gainratio/avow` (ts/) to npm. The pair is versioned together,
# so a single `git tag vX.Y.Z && git push --tags` fans out to two token-free jobs — there
# is NO PyPI token and NO npm write token in this repo.
#
# One-time bootstrap before the first OIDC release (both deferred — need a human):
#   * PyPI (avow): register the GitHub Actions trusted publisher as a PENDING publisher
#     (avow is not yet on PyPI). The workflow filename + repo + owner ARE the credential.
#   * npm (@gainratio/avow): npm has NO pending publisher — do ONE token/OTP `npm publish`
#     by hand to create the name, THEN register the trusted publisher ({owner, assay,
#     publish.yml}). Every tag push after that runs through here, token-free.
#
# npm truths (see ts-publish.yml): `--provenance` writes a PUBLIC transparency-log entry,
# so provenance stays FALSE until assay goes public. Also ts/package.json currently has NO
# `repository.url`; add one that exactly matches the GitHub repo before the first npm OIDC
# release, or the publish fails with ENEEDAUTH.
#
# NOTE: hseshadr/ci is referenced at @ci-v2, which is not cut yet (pending). The reusable
# OIDC workflows live on the ci repo's feat/oidc-publish branch until that tag is created.
name: Publish (OIDC)
on:
  push:
    tags: ["v*"]
# Top-level read-only; each job grants the OIDC write scope on itself only (the ci repo
# security policy forbids a top-level `id-token: write`).
permissions:
  contents: read
jobs:
  # Python `avow` -> PyPI. Re-runs `uv run poe gate` on the tagged ref before building.
  publish-pypi:
    permissions:
      id-token: write # OIDC — PyPI verifies this against the registered trusted publisher.
      contents: read
    uses: hseshadr/ci/.github/workflows/python-publish.yml@ci-v2
    with:
      working-directory: "."
      sync-args: "--frozen --all-extras"

  # TS `@gainratio/avow` (ts/) -> npm. Re-runs `pnpm gate` (lint -> tsc -> vitest
  # conformance -> build); no browser step, so it runs in ts-publish as-is.
  publish-npm:
    permissions:
      id-token: write # OIDC — npm verifies this against the registered trusted publisher.
      contents: read
    uses: hseshadr/ci/.github/workflows/ts-publish.yml@ci-v2
    with:
      working-directory: ts
      provenance: false # flip true only in the wave the repo goes public
