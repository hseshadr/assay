[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assay"
dynamic = ["version"]
description = "The scoring engine that refuses to lie: deterministic ML/eval scores returned calibrated, uncertainty-aware, and wrapped in a signed, offline-verifiable receipt."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Harish Seshadri", email = "harish.seshadri@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Assay writes ONLY the trust / honesty / composition layer. Every metric,
# statistics, calibration, canonicalization, and crypto primitive is REUSED
# from these pinned, maintained libraries — never reimplemented.
dependencies = [
    "scikit-learn>=1.9",  # precision/recall/F1, PR-AUC, ROC-AUC, Brier
    "scipy>=1.18",        # scipy.stats.bootstrap confidence intervals
    "numpy>=2.5",         # array math shared by sklearn + scipy
    "pydantic>=2.11",     # typed ScoreReceipt model at the I/O boundary
    "pydantic-settings>=2.11",  # env-driven tunables (no hardcoded thresholds/paths)
    "pynacl>=1.6",        # Ed25519 detached sign / verify
    "rfc8785>=0.1.4",     # RFC 8785 JCS canonical JSON for content-addressed identity
    "typer>=0.27",        # CLI facade
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "mypy>=2.2.0",
    "ruff>=0.15.21",
    "xenon>=0.9",
    "radon>=6.0",
    "poethepoet>=0.48.0",
]

[project.scripts]
assay = "assay.cli:app"

[project.urls]
Homepage = "https://github.com/hseshadr/assay"
Repository = "https://github.com/hseshadr/assay"
Issues = "https://github.com/hseshadr/assay/issues"

# Version is single-sourced from src/assay/_version.py — hatchling reads it at
# build time, so installed metadata and assay.__version__ can never drift.
[tool.hatch.version]
path = "src/assay/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C901", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S", "PL", "A", "PT"]
ignore = ["S101", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "C901", "PLR0911", "PLR0912"]
# The domain-error catalog deliberately uses semantic names (SignatureInvalid,
# ReplayMismatch, ...) that read as the failure condition, not Error-suffixed
# names. These are the stable, coded public interface consumed across the API,
# CLI and tests, so N818 (Error suffix) is scoped-off for this one module only.
"src/assay/errors.py" = ["N818"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.isort]
known-first-party = ["assay"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
mypy_path = "src"

# These third-party libraries ship no type stubs; assay wraps them behind its
# own typed contracts, so import-time Any is contained at the boundary.
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "nacl.*", "rfc8785.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--cov=assay",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
    "-v",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "\\.\\.\\.",
]
fail_under = 90.0

[tool.poe.tasks]
lint = "ruff check src/ tests/"
fmt-check = "ruff format --check src/ tests/"
fmt = "ruff format src/ tests/"
complexity = "xenon --max-absolute A --max-modules A --max-average A src/assay"
test = "pytest"
# `gate` mirrors CI exactly (lint + format-check + typecheck + complexity + test).
gate = ["lint", "fmt-check", "typecheck", "complexity", "test"]

[tool.poe.tasks.typecheck]
cmd = "mypy --strict src/assay"
