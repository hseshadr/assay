[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avow"
dynamic = ["version"]
description = "The trust kernel: one signed, offline-verifiable receipt envelope (avow) with a scoring face (assay) and an effect-gate face (writ)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Harish Seshadri", email = "harish.seshadri@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Base deps = the trust ENVELOPE only (avow + writ). Kept deliberately light so
# `pip install avow` — and micropip in Pyodide — never pull the scientific stack.
# Every primitive is REUSED from these pinned, maintained libraries, never reimplemented.
dependencies = [
    "pydantic>=2.11",           # typed SignedReceipt model at the I/O boundary
    "pydantic-settings>=2.11",  # env-driven tunables (no hardcoded thresholds/paths)
    "pynacl>=1.6",              # Ed25519 detached sign / verify
    "rfc8785>=0.1.4",           # RFC 8785 JCS canonical JSON for content-addressed identity
]

[project.optional-dependencies]
# The scoring face (`import assay`) needs the scientific stack; install `avow[assay]`.
assay = [
    "scikit-learn>=1.9",  # precision/recall/F1, PR-AUC, ROC-AUC, Brier
    "scipy>=1.18",        # scipy.stats.bootstrap confidence intervals
    "numpy>=2.5",         # array math shared by sklearn + scipy
]
# The Typer CLI is optional; install `avow[cli]` (implies [assay]). The distribution
# is `avow` but the console script it installs is `assay` — see [project.scripts].
cli = [
    "typer>=0.27",
    "avow[assay]",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "mypy>=2.2.0",
    "ruff>=0.15.21",
    "xenon>=0.9",
    "radon>=6.0",
    "poethepoet>=0.48.0",
]

[project.scripts]
assay = "assay.cli:app"

[project.urls]
Homepage = "https://github.com/hseshadr/assay"
Repository = "https://github.com/hseshadr/assay"
Issues = "https://github.com/hseshadr/assay/issues"

# Version is single-sourced from src/avow/_version.py — hatchling reads it at
# build time, so installed metadata and avow.__version__ can never drift.
[tool.hatch.version]
path = "src/avow/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/avow", "src/assay", "src/writ"]

[tool.hatch.build.targets.sdist]
# Python-distribution sources only; the TypeScript package ships separately as @edgeproc/avow on npm.
only-include = [
  "src",
  "tests",
  "testdata",
  "demo",
  "README.md",
  "QUICKSTART.md",
  "CHANGELOG.md",
  "LICENSE",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C901", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S", "PL", "A", "PT"]
ignore = ["S101", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "C901", "PLR0911", "PLR0912"]
# The domain-error catalog deliberately uses semantic names (SignatureInvalid,
# PayloadHashMismatch, ...) that read as the failure condition, not Error-suffixed
# names. These are the stable, coded public interface consumed across the API,
# CLI and tests, so N818 (Error suffix) is scoped-off for this one module only.
"src/assay/errors.py" = ["N818"]
# The envelope error catalog uses the same semantic (non-Error-suffixed) names.
"src/avow/errors.py" = ["N818"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.isort]
known-first-party = ["assay", "avow", "writ"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
mypy_path = "src"

# These third-party libraries ship no type stubs; assay wraps them behind its
# own typed contracts, so import-time Any is contained at the boundary.
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "nacl.*", "rfc8785.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--cov=avow",
    "--cov=assay",
    "--cov=writ",
    # Branch coverage, not just statement coverage: a line can be executed while one
    # side of its condition never is, and an integrity tool cannot afford that blind spot.
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
    "-v",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    # Anchored to a bare `...` stub body ONLY. The unanchored `\.\.\.` this
    # replaces also matched the ellipsis inside `tuple[X, ...]` annotations, which
    # silently excluded every function whose signature carried one — including the
    # ledger's own read_all/verify_integrity. Coverage must not be able to hide code.
    "^\\s*\\.\\.\\.$",
]
fail_under = 90.0

[tool.poe.tasks]
lint = "ruff check src/ tests/"
fmt-check = "ruff format --check src/ tests/"
fmt = "ruff format src/ tests/"
complexity = "xenon --max-absolute A --max-modules A --max-average A src/avow src/assay src/writ"
test = "pytest"
# `gate` mirrors the CI `gate` job exactly: lint + format-check + typecheck +
# complexity + test. It is PYTHON ONLY — the TypeScript package has its own gate,
# mirroring the separate CI `ts-gate` job. `gate-all` runs both, as CI does.
gate = ["lint", "fmt-check", "typecheck", "complexity", "test"]
gate-all = ["gate", "gate-ts"]

# Mirrors the CI `ts-gate` job (biome -> tsc --noEmit -> vitest -> build).
# Needs pnpm; the Python gate above does not.
[tool.poe.tasks.gate-ts]
cmd = "pnpm gate"
cwd = "ts"

[tool.poe.tasks.typecheck]
cmd = "mypy --strict src/avow src/assay src/writ"
