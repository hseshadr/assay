[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assay-engine"
dynamic = ["version"]
description = "Explainable composition of measurements recorded on heterogeneous scales."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Harish Seshadri", email = "harish.seshadri@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.11",
]

[project.optional-dependencies]
metrics = [
    "pydantic-settings>=2.11",
    "scikit-learn>=1.9",  # precision/recall/F1, PR-AUC, ROC-AUC, Brier
    "scipy>=1.18",        # scipy.stats.bootstrap confidence intervals
    "numpy>=2.5",         # array math shared by sklearn + scipy
    # trec_eval's own arithmetic for the ranking face (nDCG, AP, P@k, R@k, RR). Exactly
    # one transitive dependency — pytrec-eval-terrier, the C++ binding to the reference
    # implementation — whose own deps are numpy + scipy, already pinned right above.
    "ir-measures>=0.4.3",
]
cli = [
    "typer>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "mypy>=2.2.0",
    "ruff>=0.15.21",
    "xenon>=0.9",
    "radon>=6.0",
    "poethepoet>=0.48.0",
]

[project.scripts]
assay = "assay.cli:main"

[project.urls]
Homepage = "https://github.com/hseshadr/assay"
Repository = "https://github.com/hseshadr/assay"
Issues = "https://github.com/hseshadr/assay/issues"

# Hatchling and ``assay.__version__`` read the same source.
[tool.hatch.version]
path = "src/assay/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]

[tool.hatch.build.targets.sdist]
# Python-distribution sources only; the TypeScript package ships separately.
only-include = [
  "src",
  "tests",
  "testdata",
  "demo",
  "README.md",
  "QUICKSTART.md",
  "CHANGELOG.md",
  "docs",
  "LICENSE",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C901", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S", "PL", "A", "PT"]
ignore = ["S101", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "C901", "PLR0911", "PLR0912"]
# The domain-error catalog deliberately uses semantic names (SignatureInvalid,
# PayloadHashMismatch, ...) that read as the failure condition, not Error-suffixed
# names. These are the stable, coded public interface consumed across the API,
# CLI and tests, so N818 (Error suffix) is scoped-off for this one module only.
"src/assay/errors.py" = ["N818"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.isort]
known-first-party = ["assay"]
extra-standard-library = ["fcntl"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
mypy_path = "src"

# These third-party libraries ship no type stubs; assay wraps them behind its
# own typed contracts, so import-time Any is contained at the boundary.
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "-v",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    # Anchored to a bare `...` stub body ONLY. The unanchored `\.\.\.` this
    # replaces also matched the ellipsis inside `tuple[X, ...]` annotations, which
    # silently excluded every function whose signature carried one — including the
    # ledger's own read_all/verify_integrity. Coverage must not be able to hide code.
    "^\\s*\\.\\.\\.$",
]
fail_under = 90.0

[tool.poe.tasks]
# scripts/ is held to the same bar as src/ and tests/: the mutation harness is the thing
# that proves the guards can fail, so it is not exempt from the gate that guards them.
lint = "ruff check src/ tests/ scripts/"
fmt-check = "ruff format --check src/ tests/ scripts/"
fmt = "ruff format src/ tests/ scripts/"
complexity = "xenon --max-absolute A --max-modules A --max-average A src/assay scripts"
test = "pytest --cov=assay --cov-branch --cov-report=term-missing --cov-fail-under=90"
# `gate` mirrors the transitional CI gate exactly: Python quality and tests only.
# Task 9 owns release-ready performance and publication controls.
gate = ["lint", "fmt-check", "typecheck", "complexity", "test"]

# Pure Assay mutations remain available locally but are not yet a release CI claim.
# Task 9 owns the release-ready mutation lane.
mutants = "python scripts/mutation_harness.py"

[tool.poe.tasks.typecheck]
cmd = "mypy --strict src/assay scripts"
